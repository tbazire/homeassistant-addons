#
# Workflow: multi-arch build of the eebus_bridge_dev add-on (DEV channel)
#           + GHCR publish.
#
# This is the DEV counterpart of build.yaml. It is fully isolated from the
# production workflow:
#   - Triggers on a DIFFERENT tag pattern (dev-v*) so a production v* tag
#     never builds the dev image (and vice-versa).
#   - Builds a DIFFERENT image (ghcr.io/<owner>/<arch>-eebus-bridge-dev:<ver>).
#   - Reads the dev add-on under eebus_bridge_dev/.
#
# Behavior:
#   - push/PR on main : build the arches, no push.
#   - tag dev-v*      : build + push per-arch images, then assemble and sign a
#                       multi-arch manifest
#                       ghcr.io/<owner>/eebus-bridge-dev:<ver>.
#
# Version convention (CRUCIAL — keep build-dev.yaml and release-dev.yaml in
# sync):
#   - git tag           : dev-v<version>          e.g. dev-v0.2.0
#   - config.yaml       : "<version>-dev"         e.g. "0.2.0-dev"
#   - docker image tag  : <version>-dev           e.g. 0.2.0-dev
# So the suffix "-dev" is appended when stripping the tag prefix. The git tag
# itself does NOT carry the "-dev" suffix (it is implied by the dev-v prefix).
#
# References:
#   - https://github.com/home-assistant/builder
#   - https://developers.home-assistant.io/docs/add-ons/publishing/

name: Build (Dev)

on:
  push:
    branches: [main]
    tags: ["dev-v*"]
  pull_request:
    branches: [main]

# id-token: write -> Cosign keyless (OIDC).
# packages: write  -> push to ghcr.io via GITHUB_TOKEN.
# contents: read   -> checkout.
permissions:
  contents: read
  packages: write
  id-token: write

env:
  # Short image name for the DEV channel. The `build` job produces
  # ghcr.io/<owner>/<arch>-<IMAGE_NAME>:<version>, the `manifest` job
  # assembles ghcr.io/<owner>/<IMAGE_NAME>:<version>.
  IMAGE_NAME: eebus-bridge-dev
  # Path of the dev add-on inside the repo (kept as an env var so the whole
  # workflow stays self-documenting if the directory is ever renamed).
  ADDON_DIR: eebus_bridge_dev

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # arch      = HA name (config.yaml, io.hass.arch label)
        # platform  = buildx notation (linux/<goarch>[/<variant>])
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
          - arch: i386
            platform: linux/386
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve metadata (version, push, base image)
        id: meta
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          # Dev releases use the dev-v* tag prefix. Strip both "dev-v" to get
          # the bare version (e.g. dev-v0.1.0 -> 0.1.0). On a non-tagged branch,
          # use 'dev' (validation build, no push).
          if [[ "${GITHUB_REF}" == refs/tags/dev-v* ]]; then
            version="${GITHUB_REF_NAME#dev-v}-dev"
            push="true"
          else
            version="dev"
            push="false"
          fi
          # BUILD_FROM: HA base image per arch. Same mapping as build.yaml.
          case "${ARCH}" in
            aarch64) base="ghcr.io/home-assistant/aarch64-base:3.21" ;;
            amd64)   base="ghcr.io/home-assistant/amd64-base:3.21"   ;;
            i386)    base="ghcr.io/home-assistant/i386-base:3.21"    ;;
            *) echo "::error::Unsupported architecture: ${ARCH}" && exit 1 ;;
          esac
          echo "version=${version}"  >> "$GITHUB_OUTPUT"
          echo "push=${push}"        >> "$GITHUB_OUTPUT"
          echo "base_image=${base}"  >> "$GITHUB_OUTPUT"

      # QEMU: required to cross-build ARM arches from an AMD64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build (and push if tagged). Context + Dockerfile point at the dev
      # add-on directory. `platforms:` is CRITICAL for cross-build: without
      # it buildx ignores QEMU and falls back to the runner platform (amd64),
      # which makes the base image resolution fail for ARM.
      - name: Build image (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ github.workspace }}/${{ env.ADDON_DIR }}
          file: ${{ github.workspace }}/${{ env.ADDON_DIR }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ steps.meta.outputs.push == 'true' }}
          pull: true
          build-args: |
            BUILD_FROM=${{ steps.meta.outputs.base_image }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.meta.outputs.version }}
          labels: |
            io.hass.name=EEBUS Bridge (Dev)
            io.hass.description=Development channel of the EEBUS bridge for Home Assistant
            io.hass.version=${{ steps.meta.outputs.version }}
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            org.opencontainers.image.title=EEBUS Bridge (Dev)
            org.opencontainers.image.description=Development channel of the EEBUS bridge for Home Assistant
            org.opencontainers.image.source=https://github.com/tbazire/homeassistant-addons
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Cosign keyless: sign the pushed image (tag dev-v* only).
      - name: Install Cosign
        if: steps.meta.outputs.push == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (${{ matrix.arch }})
        if: steps.meta.outputs.push == 'true'
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          echo "Signing: ${IMAGE_REF}"
          cosign sign --yes "${IMAGE_REF}"

  manifest:
    name: Publish multi-arch manifest (Dev)
    needs: build
    runs-on: ubuntu-latest
    # Only on a dev release (tag dev-v*) AND only if all per-arch builds
    # succeeded.
    if: startsWith(github.ref, 'refs/tags/dev-v') && !cancelled() && success()
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: meta
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#dev-v}-dev" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Create and sign multi-arch manifest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          REGISTRY_PREFIX="ghcr.io/${OWNER}"
          # Sources: the per-arch images already published by the `build` job.
          SOURCE_IMAGES=(
            "${REGISTRY_PREFIX}/aarch64-${IMAGE_NAME}:${VERSION}"
            "${REGISTRY_PREFIX}/amd64-${IMAGE_NAME}:${VERSION}"
            "${REGISTRY_PREFIX}/i386-${IMAGE_NAME}:${VERSION}"
          )
          METADATA_FILE="$(mktemp)"
          docker buildx imagetools create \
            --metadata-file "${METADATA_FILE}" \
            -t "${REGISTRY_PREFIX}/${IMAGE_NAME}:${VERSION}" \
            "${SOURCE_IMAGES[@]}"
          DIGEST="$(jq -r '.["containerimage.descriptor"].digest' "${METADATA_FILE}")"
          echo "Manifest published: ${REGISTRY_PREFIX}/${IMAGE_NAME}:${VERSION} (@${DIGEST})"
          cosign sign --yes "${REGISTRY_PREFIX}/${IMAGE_NAME}@${DIGEST}"

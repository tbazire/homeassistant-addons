#
# Release workflow for the DEV channel. Triggered by a tag dev-v* on main.
# Builds the GitHub Release notes from eebus_bridge_dev/CHANGELOG.md and
# attaches them to the release.
#
# This is the DEV counterpart of release.yaml. It is isolated from the
# production release workflow via the dev-v* tag filter.
#
# The Docker image itself is built and published by build-dev.yaml; this
# workflow only manages the GitHub Release object.

name: Release (Dev)

on:
  push:
    tags: ["dev-v*"]

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release (Dev)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history for changelog extraction

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          # Dev tags use the dev-v* prefix; strip it to get the bare version.
          version="${GITHUB_REF_NAME#dev-v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved dev version: ${version}"

      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # Extract the section of eebus_bridge_dev/CHANGELOG.md matching this
          # version. Falls back to the [Unreleased] section if no match.
          CHANGELOG="eebus_bridge_dev/CHANGELOG.md"
          if [ ! -f "${CHANGELOG}" ]; then
            echo "::error::missing ${CHANGELOG}"
            exit 1
          fi
          NOTES="$(awk -v v="${VERSION}" '
            /^## / { in_section = ($0 ~ v) }
            in_section { print }
          ' "${CHANGELOG}")"
          if [ -z "${NOTES}" ]; then
            NOTES="(No changelog entry found for ${VERSION}.)"
          fi
          {
            echo "notes<<EOF"
            echo "${NOTES}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "eebus_bridge_dev v${{ steps.meta.outputs.version }}"
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          # Dev releases are always marked as prerelease.
          prerelease: true
          generate_release_notes: false
